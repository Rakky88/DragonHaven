name: dragon_haven
description: Collect dragons, grow the Dragon Tower and fill the Draconomicon.
publish_to: 'none'
version: 0.4.2+10035
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  integration_test:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  supabase_flutter: '>=2.14.2 <2.15.0'
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/dragonhaven_logo.png
    - assets/images/hatch_reveal_background.webp
    - assets/images/evolution_reveal_background.webp
    - assets/images/tower_nest_deep_night.webp
