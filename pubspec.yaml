    - assets/images/tower_nest_morning.webp
    - assets/images/tower_nest_day.webp
    - assets/images/tower_nest_golden_hour.webp
    - assets/images/tower_nest_dusk.webp
    - assets/images/tower_nest_night.webp
    - assets/images/house_room_nest.webp
    - assets/images/house_room_hearth.webp
    - assets/images/house_room_crystal.webp
    - assets/images/house_room_garden.webp
    - assets/images/house_room_tidal_library.webp
    - assets/images/house_room_loft.webp
    - assets/images/house_room_cloud.webp
    - assets/images/house_room_sunforge.webp
    - assets/images/house_room_nest_day.webp
    - assets/images/house_room_nest_night.webp
    - assets/images/house_room_hearth_day.webp
    - assets/images/house_room_hearth_night.webp
    - assets/images/house_room_crystal_day.webp
    - assets/images/house_room_crystal_night.webp
    - assets/images/house_room_garden_day.webp
    - assets/images/house_room_garden_night.webp
    - assets/images/house_room_tidal_library_day.webp
    - assets/images/house_room_tidal_library_night.webp
    - assets/images/house_room_loft_day.webp
    - assets/images/house_room_loft_night.webp
