    - assets/images/ui/
    - assets/images/ui/trials/
    - assets/images/ui/evolution_frames/

flutter_launcher_icons:
  android: true
  min_sdk_android: 21
  image_path: assets/images/dragonhaven_app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/dragonhaven_logo.png
