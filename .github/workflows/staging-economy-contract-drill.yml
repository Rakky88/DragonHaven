name: Staging economy contract drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT to run
        required: true
        type: string
      contract:
        description: Rollback-only contract or one read-only load observation
        required: true
        default: foundation
        type: choice
        options:
          - foundation
          - legacy-import-restore
          - load-observer
          - social-push
          - social-push-apply
          - push-device-probe
          - canonical-game

permissions:
  contents: read

concurrency:
  # Never contaminate a capacity measurement with a restore rehearsal.
  group: ${{ inputs.contract == 'load-observer' && 'dragonhaven-staging-observer' || 'dragonhaven-staging-load' }}
  cancel-in-progress: false

jobs:
  observe-load:
    if: inputs.contract == 'load-observer'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Observe only aggregate staging load progress
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'OBSERVE_DRAGONHAVEN_STAGING_LOAD') {
            throw 'The exact read-only observation scope is missing.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_load_observer.ps1 |
            Tee-Object -FilePath staging/load-observation.json
      - uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-load-observation
          path: staging/load-observation.json
          retention-days: 30

  verify:
    if: inputs.contract != 'load-observer' && inputs.contract != 'social-push' && inputs.contract != 'social-push-apply' && inputs.contract != 'push-device-probe' && inputs.contract != 'canonical-game'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require exact staging-only scope
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'The exact staging contract-drill confirmation is missing.'
          }
          $required = @(
            'STAGING_SUPABASE_URL',
            'STAGING_SUPABASE_PUBLISHABLE_KEY',
            'STAGING_SUPABASE_PROJECT_REF',
            'STAGING_SUPABASE_ACCESS_TOKEN',
            'STAGING_SUPABASE_DB_PASSWORD',
            'STAGING_E2E_EMAIL',
            'STAGING_E2E_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected staging configuration: $name."
            }
          }
          $projectRef = $env:STAGING_SUPABASE_PROJECT_REF.Trim()
          $baseUrl = $env:STAGING_SUPABASE_URL.TrimEnd('/')
          if ($projectRef -eq 'tnzathhutuwmohmjfrlo' -or
              $baseUrl -eq 'https://tnzathhutuwmohmjfrlo.supabase.co') {
            throw 'This workflow must never target production.'
          }
          if ($projectRef -notmatch '^[a-z0-9]{20}$' -or
              $baseUrl -ne "https://$projectRef.supabase.co") {
            throw 'The staging URL and project reference do not match.'
          }

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Verify exact schema and run rollback-only contract drill
        shell: pwsh
        env:
          SELECTED_CONTRACT: ${{ inputs.contract }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link `
            --project-ref $env:STAGING_SUPABASE_PROJECT_REF `
            --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Staging link failed.' }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/release_server_preflight.ps1 `
            -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL `
            -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY |
            Tee-Object -FilePath staging/economy-contract-preflight.txt
          if ((Get-ChildItem supabase/migrations -File -Filter '*.sql').Count -ne 49) {
            throw 'The repository is not at the expected 49 migrations.'
          }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/economy-contract-health-before.json
          if ($env:SELECTED_CONTRACT -eq 'legacy-import-restore') {
            ./tool/staging_legacy_import_restore_contract.ps1 `
              -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
              -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
              Tee-Object -FilePath staging/legacy-import-restore.json
          } else {
            ./tool/staging_economy_foundation_e2e.ps1 `
              -SupabaseUrl $env:STAGING_SUPABASE_URL `
              -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
              -Email $env:STAGING_E2E_EMAIL `
              -Password $env:STAGING_E2E_PASSWORD `
              -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
              -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
              -EvidencePath staging/economy-contract-drill.txt
          }
          supabase db lint `
            --linked `
            --level error `
            --fail-on error `
            --output-format json |
            Tee-Object -FilePath staging/economy-contract-lint.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Database lint after the rollback-only drill failed.'
          }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/economy-contract-health-after.json

      - name: Upload privacy-safe staging evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-economy-contract-drill
          path: staging/
          if-no-files-found: warn
          retention-days: 30

  social-push:
    if: inputs.contract == 'social-push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse dormant push migrations and rollback all changes
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_social_push_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
            -RehearseMigrations |
            Tee-Object -FilePath staging/social-push-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-push-contract
          path: staging/social-push-contract.txt
          if-no-files-found: warn
          retention-days: 30

  social-push-apply:
    if: inputs.contract == 'social-push-apply'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Apply and verify dormant push on staging only
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          FIREBASE_MESSAGING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_MESSAGING_SERVICE_ACCOUNT }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          if ($env:CONFIRMATION -cne 'APPLY_DRAGONHAVEN_STAGING_PUSH_50_51') {
            throw 'Exact staging apply scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_social_push_apply.ps1 |
            Tee-Object -FilePath staging/social-push-apply.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-push-apply
          path: staging/social-push-apply.txt
          if-no-files-found: warn
          retention-days: 30

  push-device-probe:
    if: inputs.contract == 'push-device-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Probe the real staging worker and operator test device
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_PUSH_PROBE_TOKEN: ${{ secrets.STAGING_PUSH_PROBE_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_DEVICE_PUSH') {
            throw 'Exact staging device probe scope is required.'
          }
          ./tool/staging_push_device_probe.ps1

  canonical-game:
    if: inputs.contract == 'canonical-game'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse the detached game-state transaction and roll everything back
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_game_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-game-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-canonical-game-contract
          path: staging/canonical-game-contract.txt
          if-no-files-found: warn
          retention-days: 30
