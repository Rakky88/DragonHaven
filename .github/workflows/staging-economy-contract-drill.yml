name: Staging economy contract drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT to run
        required: true
        type: string
      contract:
        description: Rollback-only contract or one read-only load observation
        required: true
        default: foundation
        type: choice
        options:
          - foundation
          - legacy-import-restore
          - load-observer
          - social-push
          - social-push-apply
          - push-device-probe
          - canonical-game
          - canonical-game-apply
          - canonical-import
          - canonical-read
          - canonical-social-projection
          - canonical-social-reservations
          - canonical-group-lifecycle
          - canonical-pair-lifecycle
          - canonical-beacon
          - canonical-trades
          - wide-trial-scores
          - canonical-seasonal-trials
          - canonical-group-cleanup
          - canonical-account-activation
          - canonical-group-probe
          - canonical-partner-probe
          - canonical-beacon-probe
          - canonical-trade-probe

permissions:
  contents: read

concurrency:
  # Never contaminate a capacity measurement with a restore rehearsal.
  group: ${{ inputs.contract == 'load-observer' && 'dragonhaven-staging-observer' || 'dragonhaven-staging-load' }}
  cancel-in-progress: false

jobs:
  observe-load:
    if: inputs.contract == 'load-observer'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Observe only aggregate staging load progress
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'OBSERVE_DRAGONHAVEN_STAGING_LOAD') {
            throw 'The exact read-only observation scope is missing.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_load_observer.ps1 |
            Tee-Object -FilePath staging/load-observation.json
      - uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-load-observation
          path: staging/load-observation.json
          retention-days: 30

  verify:
    if: inputs.contract != 'load-observer' && inputs.contract != 'social-push' && inputs.contract != 'social-push-apply' && inputs.contract != 'push-device-probe' && inputs.contract != 'canonical-game' && inputs.contract != 'canonical-game-apply' && inputs.contract != 'canonical-import' && inputs.contract != 'canonical-read' && inputs.contract != 'canonical-social-projection' && inputs.contract != 'canonical-social-reservations' && inputs.contract != 'canonical-group-lifecycle' && inputs.contract != 'canonical-pair-lifecycle' && inputs.contract != 'canonical-beacon' && inputs.contract != 'canonical-trades' && inputs.contract != 'wide-trial-scores' && inputs.contract != 'canonical-seasonal-trials' && inputs.contract != 'canonical-group-cleanup' && inputs.contract != 'canonical-account-activation' && inputs.contract != 'canonical-group-probe' && inputs.contract != 'canonical-partner-probe' && inputs.contract != 'canonical-beacon-probe' && inputs.contract != 'canonical-trade-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require exact staging-only scope
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'The exact staging contract-drill confirmation is missing.'
          }
          $required = @(
            'STAGING_SUPABASE_URL',
            'STAGING_SUPABASE_PUBLISHABLE_KEY',
            'STAGING_SUPABASE_PROJECT_REF',
            'STAGING_SUPABASE_ACCESS_TOKEN',
            'STAGING_SUPABASE_DB_PASSWORD',
            'STAGING_E2E_EMAIL',
            'STAGING_E2E_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected staging configuration: $name."
            }
          }
          $projectRef = $env:STAGING_SUPABASE_PROJECT_REF.Trim()
          $baseUrl = $env:STAGING_SUPABASE_URL.TrimEnd('/')
          if ($projectRef -eq 'tnzathhutuwmohmjfrlo' -or
              $baseUrl -eq 'https://tnzathhutuwmohmjfrlo.supabase.co') {
            throw 'This workflow must never target production.'
          }
          if ($projectRef -notmatch '^[a-z0-9]{20}$' -or
              $baseUrl -ne "https://$projectRef.supabase.co") {
            throw 'The staging URL and project reference do not match.'
          }

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Verify exact schema and run rollback-only contract drill
        shell: pwsh
        env:
          SELECTED_CONTRACT: ${{ inputs.contract }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link `
            --project-ref $env:STAGING_SUPABASE_PROJECT_REF `
            --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Staging link failed.' }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/release_server_preflight.ps1 `
            -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL `
            -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY |
            Tee-Object -FilePath staging/economy-contract-preflight.txt
          if ((Get-ChildItem supabase/migrations -File -Filter '*.sql').Count -ne 49) {
            throw 'The repository is not at the expected 49 migrations.'
          }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/economy-contract-health-before.json
          if ($env:SELECTED_CONTRACT -eq 'legacy-import-restore') {
            ./tool/staging_legacy_import_restore_contract.ps1 `
              -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
              -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
              Tee-Object -FilePath staging/legacy-import-restore.json
          } else {
            ./tool/staging_economy_foundation_e2e.ps1 `
              -SupabaseUrl $env:STAGING_SUPABASE_URL `
              -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
              -Email $env:STAGING_E2E_EMAIL `
              -Password $env:STAGING_E2E_PASSWORD `
              -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
              -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
              -EvidencePath staging/economy-contract-drill.txt
          }
          supabase db lint `
            --linked `
            --level error `
            --fail-on error `
            --output-format json |
            Tee-Object -FilePath staging/economy-contract-lint.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Database lint after the rollback-only drill failed.'
          }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/economy-contract-health-after.json

      - name: Upload privacy-safe staging evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-economy-contract-drill
          path: staging/
          if-no-files-found: warn
          retention-days: 30

  social-push:
    if: inputs.contract == 'social-push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse dormant push migrations and rollback all changes
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_social_push_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
            -RehearseMigrations |
            Tee-Object -FilePath staging/social-push-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-push-contract
          path: staging/social-push-contract.txt
          if-no-files-found: warn
          retention-days: 30

  social-push-apply:
    if: inputs.contract == 'social-push-apply'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Apply and verify dormant push on staging only
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          FIREBASE_MESSAGING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_MESSAGING_SERVICE_ACCOUNT }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          if ($env:CONFIRMATION -cne 'APPLY_DRAGONHAVEN_STAGING_PUSH_50_51') {
            throw 'Exact staging apply scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_social_push_apply.ps1 |
            Tee-Object -FilePath staging/social-push-apply.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-push-apply
          path: staging/social-push-apply.txt
          if-no-files-found: warn
          retention-days: 30

  push-device-probe:
    if: inputs.contract == 'push-device-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Probe the real staging worker and operator test device
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_PUSH_PROBE_TOKEN: ${{ secrets.STAGING_PUSH_PROBE_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_DEVICE_PUSH') {
            throw 'Exact staging device probe scope is required.'
          }
          ./tool/staging_push_device_probe.ps1

  canonical-game:
    if: inputs.contract == 'canonical-game'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse the detached game-state transaction and roll everything back
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_game_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-game-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-canonical-game-contract
          path: staging/canonical-game-contract.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-game-apply:
    if: inputs.contract == 'canonical-game-apply'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Compile and verify the exact shared rules candidate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = APPLY_DRAGONHAVEN_STAGING_GAME_79
          flutter pub get
          dart analyze lib integration_test test tool
          flutter test --no-pub --concurrency=1
          TZ=Europe/Amsterdam flutter test --no-pub test/calendar_authority_test.dart test/game_time_bridge_test.dart
          TZ=America/New_York flutter test --no-pub test/calendar_authority_test.dart test/game_time_bridge_test.dart
          dart run tool/build_server_game.dart
          deno check supabase/functions/execute-game-command/index.ts
          deno check tool/prepare_staging_game_import.ts
          deno test supabase/functions/execute-game-command/core_test.ts
          dart run tool/game_domain_parity.dart "$(command -v deno)"
          mkdir -p staging
          flutter test --no-pub --dart-define=DOMAIN_PARITY_OUTPUT=staging/game-fixture.json test/game_domain_parity_fixture_test.dart
          deno run --allow-read=staging/game-fixture.json tool/server_projection_contract.ts staging/game-fixture.json
      - name: Apply the detached schema, deploy and probe only staging
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          ./tool/staging_game_worker_apply.ps1 | Tee-Object -FilePath staging/game-worker.txt
          python3 tool/staging_game_worker_probe.py --prepare-import | Tee-Object -FilePath staging/game-worker-probe.txt
          if ($LASTEXITCODE -ne 0) { throw 'Real game worker probe failed.' }
          ./tool/release_server_preflight.ps1 -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-game-worker
          path: |
            staging/game-worker.txt
            staging/game-worker-probe.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-import:
    if: inputs.contract == 'canonical-import'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse immutable import generations and preparation with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_import_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-import-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-canonical-import
          path: staging/canonical-import-contract.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-read:
    if: inputs.contract == 'canonical-read'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse private game reads with paused mutations with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_game_read_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-read-contract.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-canonical-read
          path: staging/canonical-read-contract.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-social-projection:
    if: inputs.contract == 'canonical-social-projection'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse social projection and legacy guards with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_social_projection_contract.ps1 -RehearseMigrations `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-social-projection.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-projection
          path: staging/canonical-social-projection.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-social-reservations:
    if: inputs.contract == 'canonical-social-reservations'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse social reservations and legacy guards with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_social_reservation_contract.ps1 -RehearseMigrations `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-social-reservations.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-social-reservations
          path: staging/canonical-social-reservations.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-group-lifecycle:
    if: inputs.contract == 'canonical-group-lifecycle'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse group membership and shared starts with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/staging_canonical_group_lifecycle_contract.ps1 -RehearseMigrations `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/canonical-group-lifecycle.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-group-lifecycle
          path: staging/canonical-group-lifecycle.txt
          if-no-files-found: warn
          retention-days: 30

  canonical-pair-lifecycle:
    if: inputs.contract == 'canonical-pair-lifecycle'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rehearse partner invitations and shared starts with rollback
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT') {
            throw 'Exact staging rollback scope is required.'
