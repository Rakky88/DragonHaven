  canonical-group-probe:
    if: inputs.contract == 'canonical-group-probe' || inputs.contract == 'canonical-partner-probe' || inputs.contract == 'canonical-beacon-probe' || inputs.contract == 'canonical-trade-probe'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - name: Build the synthetic group fixture
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = TEST_DRAGONHAVEN_STAGING_ECONOMY_CONTRACT
          flutter pub get
          mkdir -p staging
          flutter test --no-pub --dart-define=DOMAIN_PARITY_OUTPUT=staging/game-fixture.json test/game_domain_parity_fixture_test.dart
      - name: Probe the deployed worker with synthetic keepers
        shell: pwsh
        env:
          STAGING_SOCIAL_PROBE: ${{ inputs.contract == 'canonical-trade-probe' && 'trade' || inputs.contract == 'canonical-partner-probe' && 'pair' || inputs.contract == 'canonical-beacon-probe' || inputs.contract == 'canonical-trade-probe' && 'beacon' || 'group' }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 tool/staging_group_probe_only.py | Tee-Object -FilePath staging/group-probe.txt
          if ($LASTEXITCODE -ne 0) { throw 'Focused group probe failed.' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-staging-group-probe
          path: staging/group-probe.txt
          if-no-files-found: warn
          retention-days: 30
