name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without the v prefix (for example 0.04.01)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Verify linked production server
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw 'SUPABASE_ACCESS_TOKEN ontbreekt.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
            throw 'SUPABASE_DB_PASSWORD ontbreekt.'
          }
          supabase link --project-ref tnzathhutuwmohmjfrlo --password $env:SUPABASE_DB_PASSWORD
          ./tool/release_server_preflight.ps1

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Configure stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DRAGONHAVEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DRAGONHAVEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRAGONHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DRAGONHAVEN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "DRAGONHAVEN_KEYSTORE_BASE64 ontbreekt" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "DRAGONHAVEN_KEYSTORE_PASSWORD ontbreekt" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "DRAGONHAVEN_KEY_PASSWORD ontbreekt" && exit 1)
          KEY_ALIAS="${KEY_ALIAS:-dragonhaven}"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed Play Store bundle
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$MANUAL_VERSION"
          fi
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || (echo "Ongeldige versie: $APP_VERSION" && exit 1)
          flutter build appbundle --release --no-pub \
            --build-name="$APP_VERSION" \
            --build-number="$((10000 + GITHUB_RUN_NUMBER))" \
            --dart-define=DRAGONHAVEN_GITHUB_OWNER=${{ github.repository_owner }} \
            --dart-define=DRAGONHAVEN_GITHUB_REPO=${{ github.event.repository.name }} \
            --dart-define=DRAGONHAVEN_APP_VERSION="$APP_VERSION" \
            --dart-define=SUPABASE_URL=https://tnzathhutuwmohmjfrlo.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_SllXjneKVmDAgtBGgkSgOg_tOJmYkX4
          mkdir -p release
          cp build/app/outputs/bundle/release/app-release.aab release/DragonHaven.aab

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonHaven-Play-Store
          path: release/DragonHaven.aab
          retention-days: 7
