name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without the v prefix (for example 0.04.01)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dragonhaven-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      EXPECTED_SIGNING_CERT_SHA256: 477C5A5D7453384CA756265E77AF97D5A002A907177CCD2D9065A9BEC3414942
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required secret configuration
        shell: pwsh
        env:
          DRAGONHAVEN_KEYSTORE_BASE64: ${{ secrets.DRAGONHAVEN_KEYSTORE_BASE64 }}
          DRAGONHAVEN_KEYSTORE_PASSWORD: ${{ secrets.DRAGONHAVEN_KEYSTORE_PASSWORD }}
          DRAGONHAVEN_KEY_ALIAS: ${{ secrets.DRAGONHAVEN_KEY_ALIAS }}
          DRAGONHAVEN_KEY_PASSWORD: ${{ secrets.DRAGONHAVEN_KEY_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          $required = @(
            'DRAGONHAVEN_KEYSTORE_BASE64',
            'DRAGONHAVEN_KEYSTORE_PASSWORD',
            'DRAGONHAVEN_KEY_ALIAS',
            'DRAGONHAVEN_KEY_PASSWORD',
            'SUPABASE_ACCESS_TOKEN',
            'SUPABASE_DB_PASSWORD'
          )
          $missing = @(
            foreach ($name in $required) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                $name
              }
            }
          )
          if ($missing.Count -gt 0) {
            throw "Ontbrekende GitHub Actions secrets: $($missing -join ', ')."
          }
          'Alle vereiste secretnamen zijn geconfigureerd; waarden worden niet gelogd.'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify production server workers
        run: |
          dart run tool/build_server_game.dart
          deno check supabase/functions/execute-game-command/index.ts
          deno test supabase/functions/execute-game-command/
          deno check supabase/functions/rewarded-ad-ssv/index.ts
          deno test supabase/functions/rewarded-ad-ssv/

      - name: Configure optional production rewarded ads
        shell: pwsh
        env:
          ADS_ENABLED: ${{ vars.DRAGONHAVEN_REWARDED_ADS_ENABLED }}
          ADS_ANDROID_APP_ID: ${{ vars.DRAGONHAVEN_ADMOB_ANDROID_APP_ID }}
          ADS_GEMS_AD_UNIT_ID: ${{ vars.DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID }}
          ADS_COINS_AD_UNIT_ID: ${{ vars.DRAGONHAVEN_ADMOB_REWARDED_COINS_ID }}
          ADS_TRIAL_REFRESH_AD_UNIT_ID: ${{ vars.DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID }}
          ADS_PUBLISHER_ID: ${{ vars.DRAGONHAVEN_ADMOB_PUBLISHER_ID }}
        run: |
          $enabled = if ([string]::IsNullOrWhiteSpace($env:ADS_ENABLED)) {
            'false'
          } else {
            $env:ADS_ENABLED.Trim().ToLowerInvariant()
          }
          if ($enabled -eq 'false') {
            'DRAGONHAVEN_REWARDED_ADS_MODE=disabled' >> $env:GITHUB_ENV
            'Rewarded ads blijven uit voor deze release.'
            exit 0
          }
          if ($enabled -ne 'true') {
            throw 'DRAGONHAVEN_REWARDED_ADS_ENABLED moet true, false of leeg zijn.'
          }
          $missing = @(
            foreach ($name in @(
              'ADS_ANDROID_APP_ID',
              'ADS_GEMS_AD_UNIT_ID',
              'ADS_COINS_AD_UNIT_ID',
              'ADS_TRIAL_REFRESH_AD_UNIT_ID',
              'ADS_PUBLISHER_ID'
            )) {
              if ([string]::IsNullOrWhiteSpace(
                  [Environment]::GetEnvironmentVariable($name))) {
                $name
              }
            }
          )
          if ($missing.Count -gt 0) {
            throw "Rewarded ads zijn aangezet, maar Variables ontbreken: $($missing -join ', ')."
          }
          ./tool/configure_rewarded_ads.ps1 `
            -AndroidAppId $env:ADS_ANDROID_APP_ID `
            -GemsAdUnitId $env:ADS_GEMS_AD_UNIT_ID `
            -CoinsAdUnitId $env:ADS_COINS_AD_UNIT_ID `
            -TrialRefreshAdUnitId $env:ADS_TRIAL_REFRESH_AD_UNIT_ID `
            -PublisherId $env:ADS_PUBLISHER_ID `
            -SsvSourceRevision $env:GITHUB_SHA
          'DRAGONHAVEN_REWARDED_ADS_MODE=production' >> $env:GITHUB_ENV
          "DRAGONHAVEN_ADMOB_ANDROID_APP_ID=$($env:ADS_ANDROID_APP_ID.Trim())" >> $env:GITHUB_ENV
          "DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID=$($env:ADS_GEMS_AD_UNIT_ID.Trim())" >> $env:GITHUB_ENV
          "DRAGONHAVEN_ADMOB_REWARDED_COINS_ID=$($env:ADS_COINS_AD_UNIT_ID.Trim())" >> $env:GITHUB_ENV
          "DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID=$($env:ADS_TRIAL_REFRESH_AD_UNIT_ID.Trim())" >> $env:GITHUB_ENV

      - name: Verify production deployment plan
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw 'SUPABASE_ACCESS_TOKEN ontbreekt.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
            throw 'SUPABASE_DB_PASSWORD ontbreekt.'
          }
          supabase link --project-ref tnzathhutuwmohmjfrlo --password $env:SUPABASE_DB_PASSWORD
          New-Item -ItemType Directory -Path release -Force | Out-Null
          ./tool/public_server_health_check.ps1 `
            -Environment production `
            -OutputPath release/server-health-before.json
          supabase db lint --linked --level error --fail-on error --output-format json |
            Tee-Object -FilePath release/database-lint-before.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Production database lint failed before deployment.'
          }
          supabase db push --linked --include-all --dry-run |
            Tee-Object -FilePath release/migration-dry-run.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'Production migration dry-run failed.'
          }

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Verify consistent MIDI levels
        run: |
          python3 tool/normalize_jukebox_midi.py --check
          python3 -m unittest tool/test_normalize_jukebox_midi.py

      - name: Configure stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DRAGONHAVEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DRAGONHAVEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRAGONHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DRAGONHAVEN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "DRAGONHAVEN_KEYSTORE_BASE64 ontbreekt" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "DRAGONHAVEN_KEYSTORE_PASSWORD ontbreekt" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "DRAGONHAVEN_KEY_PASSWORD ontbreekt" && exit 1)
          KEY_ALIAS="${KEY_ALIAS:-dragonhaven}"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Configure optional production Firebase
        env:
          DRAGONHAVEN_FIREBASE_ANDROID_CONFIG: ${{ secrets.DRAGONHAVEN_FIREBASE_ANDROID_CONFIG }}
        run: dart run tool/write_firebase_build_config.dart production

      - name: Build signed Play Store bundle
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$MANUAL_VERSION"
          fi
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || (echo "Ongeldige versie: $APP_VERSION" && exit 1)
          PUBSPEC_FULL_VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          BUILD_NUMBER="${PUBSPEC_FULL_VERSION##*+}"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || (echo "Ongeldig pubspec buildnummer: $BUILD_NUMBER" && exit 1)
          echo "DRAGONHAVEN_BUILD_NAME=$APP_VERSION" >> "$GITHUB_ENV"
          echo "DRAGONHAVEN_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          REWARDED_AD_ARGS=(
            --dart-define=DRAGONHAVEN_REWARDED_ADS_MODE="$DRAGONHAVEN_REWARDED_ADS_MODE"
          )
          if [[ "$DRAGONHAVEN_REWARDED_ADS_MODE" == "production" ]]; then
            REWARDED_AD_ARGS+=(
              --dart-define=DRAGONHAVEN_ADMOB_ANDROID_APP_ID="$DRAGONHAVEN_ADMOB_ANDROID_APP_ID"
              --dart-define=DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID="$DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID"
              --dart-define=DRAGONHAVEN_ADMOB_REWARDED_COINS_ID="$DRAGONHAVEN_ADMOB_REWARDED_COINS_ID"
              --dart-define=DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID="$DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID"
            )
          fi
          flutter build appbundle --release --no-pub \
            --dart-define-from-file=.tools/firebase-build-defines.json \
            "${REWARDED_AD_ARGS[@]}" \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=DRAGONHAVEN_GITHUB_OWNER=${{ github.repository_owner }} \
            --dart-define=DRAGONHAVEN_GITHUB_REPO=${{ github.event.repository.name }} \
            --dart-define=DRAGONHAVEN_ANDROID_STORE_URL=https://play.google.com/store/apps/details?id=nl.dragonhaven.app \
            --dart-define=DRAGONHAVEN_APP_VERSION="$APP_VERSION" \
            --dart-define=DRAGONHAVEN_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=DRAGONHAVEN_ENVIRONMENT=production \
            --dart-define=SUPABASE_URL=https://tnzathhutuwmohmjfrlo.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_SllXjneKVmDAgtBGgkSgOg_tOJmYkX4
          mkdir -p release
          cp build/app/outputs/bundle/release/app-release.aab release/DragonHaven.aab

      - name: Verify native jukebox cycles
        # Flutter creates the ignored Gradle wrapper and local SDK config above.
        # Unit tests exercise Kotlin only; they do not rebuild Flutter debug assets.
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          AAB=release/DragonHaven.aab
          test -s "$AAB"

          normalize_version() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            printf '%d.%d.%d' "$((10#$major))" "$((10#$minor))" "$((10#$patch))"
          }

          PUBSPEC_VERSION="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          test -n "$PUBSPEC_VERSION"
          test "$(normalize_version "$PUBSPEC_VERSION")" = \
            "$(normalize_version "$DRAGONHAVEN_BUILD_NAME")"
          APPLICATION_ID="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)"/\1/p' android/app/build.gradle.kts)"
          test "$APPLICATION_ID" = 'nl.dragonhaven.app'

          AAB_SHA256="$(sha256sum "$AAB" | awk '{print toupper($1)}')"
          CERT_SHA256="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_SIGNING_CERT_SHA256"
          cat > release/artifact-verification.md <<EOF
          # DragonHaven Play artifact verification

          - Commit: \`$GITHUB_SHA\`
          - Ref: \`$GITHUB_REF\`
          - Version: \`$DRAGONHAVEN_BUILD_NAME\`
          - Version code: \`$DRAGONHAVEN_BUILD_NUMBER\`
          - Android application ID: \`$APPLICATION_ID\`
          - Artifact: \`DragonHaven.aab\`
          - SHA-256: \`$AAB_SHA256\`
          - Signing certificate SHA-256: \`$CERT_SHA256\`
          - Expected signing certificate matched: yes
          - Rewarded ads mode: \`$DRAGONHAVEN_REWARDED_ADS_MODE\`
          - Rewarded-ad SSV typecheck and tests: passed
          - Flutter analyze: passed
          - Flutter tests: passed
          EOF

          cat release/artifact-verification.md

      - name: Apply matching production schema and rewarded-ad worker
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked --include-all --yes |
            Tee-Object -FilePath release/migration-apply.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'Production migration apply failed.'
          }
          if ($env:DRAGONHAVEN_REWARDED_ADS_MODE -eq 'production') {
            supabase secrets set `
              --project-ref tnzathhutuwmohmjfrlo `
              --env-file .tools/rewarded-ads-ssv-secrets.env
            if ($LASTEXITCODE -ne 0) {
              throw 'Rewarded-ad server secret update failed.'
            }
            supabase functions deploy rewarded-ad-ssv `
              --project-ref tnzathhutuwmohmjfrlo `
              --no-verify-jwt `
              --use-api
            if ($LASTEXITCODE -ne 0) {
              throw 'Rewarded-ad server deployment failed.'
            }
          }
          $preflight = @{}
          if ($env:DRAGONHAVEN_REWARDED_ADS_MODE -eq 'production') {
            $preflight = @{
              RequireRewardedAds = $true
              ExpectedRewardedGemsAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID
              ExpectedRewardedCoinsAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_COINS_ID
              ExpectedRewardedTrialRefreshAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID
              ExpectedRewardedSsvSourceRevision = $env:GITHUB_SHA
            }
          }
          ./tool/release_server_preflight.ps1 @preflight |
            Tee-Object -FilePath release/server-preflight.txt

      - name: Document release candidate verification
        shell: bash
        run: |
          cp release/artifact-verification.md release/release-verification.md
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            {
              echo '- Production schema and rewarded-ad worker: deployed'
              echo '- Server preflight: passed (see `server-preflight.txt`)'
            } >> release/release-verification.md
          else
            echo '- Production deployment: not requested for this manual bundle validation' >> release/release-verification.md
          fi
          cat release/release-verification.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-Play-Store
          path: release/
          retention-days: 7

      - name: Await public APK and activate matching game worker
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          APK_SHA256=''
          for attempt in $(seq 1 180); do
            RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
            APK_SHA256="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; v=json.load(sys.stdin); a=next((x for x in v.get("assets",[]) if x.get("name")=="DragonHaven.apk"),{}); d=a.get("digest",""); print(d[7:] if d.startswith("sha256:") else "")' 2>/dev/null || true)"
            if [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for verified public DragonHaven.apk (${attempt}/180)."
            sleep 10
          done
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]] || (echo 'Public APK did not become available in time.' && exit 1)
          python3 tool/game_ruleset_rollout.py \
            --environment production \
            --mode apply \
            --minimum-client-build 10105 \
            --release-tag "$GITHUB_REF_NAME" \
            --apk-sha256 "$APK_SHA256" \
            --evidence-dir release/game-ruleset-rollout

      - name: Verify final production server
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          $preflight = @{}
          if ($env:DRAGONHAVEN_REWARDED_ADS_MODE -eq 'production') {
            $preflight = @{
              RequireRewardedAds = $true
              ExpectedRewardedGemsAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_GEMS_ID
              ExpectedRewardedCoinsAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_COINS_ID
              ExpectedRewardedTrialRefreshAdUnitId = $env:DRAGONHAVEN_ADMOB_REWARDED_TRIAL_REFRESH_ID
              ExpectedRewardedSsvSourceRevision = $env:GITHUB_SHA
            }
          }
          ./tool/release_server_preflight.ps1 @preflight |
            Tee-Object -FilePath release/server-postflight.txt

      - name: Upload production rollout evidence
        if: ${{ always() && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-production-rollout
          path: |
            release/game-ruleset-rollout/
            release/server-postflight.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Unlink production project
        if: ${{ always() }}
        shell: pwsh
        run: supabase unlink --yes
