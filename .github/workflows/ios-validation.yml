name: iOS validation

on:
  workflow_dispatch:
    inputs:
      ios_download_url:
        description: 'Optional TestFlight URL'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Platform and localization tests
        run: >-
          flutter test --no-pub
          test/release_service_test.dart
          test/localization_completeness_test.dart

      - name: Build unsigned iPhone Simulator app
        env:
          IOS_DOWNLOAD_URL: ${{ inputs.ios_download_url }}
        run: |
          flutter build ios --simulator --debug --no-pub \
            --dart-define="DRAGONHAVEN_IOS_DOWNLOAD_URL=$IOS_DOWNLOAD_URL"
          test -d build/ios/iphonesimulator/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build/ios/iphonesimulator/Runner.app/Info.plist)" = \
            'nl.dragonhaven.app'
