name: Staging Halloween preview access 48

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_STAGING_HALLOWEEN_PREVIEW_48
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dragonhaven-staging-load
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Rehearse and apply only preview access migration 48
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          ./tool/preview_access_migration.ps1 -Environment staging `
            -ProjectRef $env:STAGING_REF -BaseUrl $env:STAGING_URL `
            -PublishableKey $env:STAGING_KEY -Confirmation $env:CONFIRMATION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-Halloween-preview-staging
          path: staging/
          retention-days: 30
