name: Staging load profile

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Create a plan or run an approved staging load stage
        required: true
        default: plan-100
        type: choice
        options:
          - plan-100
          - run-100
          - run-1000
      confirmation:
        description: For a run, type RUN_DRAGONHAVEN_STAGING_LOAD_100 or _1000
        required: false
        type: string
      baseline_run_id:
        description: Successful 100-user workflow run ID; required for run-1000
        required: false
        type: string
      temporary_accounts:
        description: Create auto-confirmed synthetic accounts and remove them after the run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: dragonhaven-staging-load
  cancel-in-progress: false

jobs:
  staging-load:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive and validate the bounded stage
        id: profile
        shell: pwsh
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          $isExecution = $env:REQUESTED_STAGE.StartsWith('run-')
          $virtualUsers = if ($env:REQUESTED_STAGE.EndsWith('1000')) { 1000 } else { 100 }
          if ($isExecution) {
            $expected = "RUN_DRAGONHAVEN_STAGING_LOAD_$virtualUsers"
            if ($env:CONFIRMATION -cne $expected) {
              throw "Exact confirmation $expected is required."
            }
          }
          if ($virtualUsers -eq 1000 -and
              $env:BASELINE_RUN_ID -notmatch '^\d+$') {
            throw 'run-1000 requires the workflow run ID of a successful 100-user baseline.'
          }
          "virtual-users=$virtualUsers" >> $env:GITHUB_OUTPUT
          "execute=$($isExecution.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          'The bounded load-stage request is valid; no secret was accessed.'
          ./tool/staging_load_accounts_contract.ps1
          ./tool/staging_load_metrics_contract.ps1

      - name: Verify isolated staging execution configuration
        if: ${{ steps.profile.outputs.execute == 'true' }}
        shell: pwsh
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_LOAD_CREDENTIALS_JSON: ${{ secrets.STAGING_LOAD_CREDENTIALS_JSON }}
          TEMPORARY_ACCOUNTS: ${{ inputs.temporary_accounts }}
        run: |
          $productionRef = 'tnzathhutuwmohmjfrlo'
          if ($env:STAGING_SUPABASE_PROJECT_REF -eq $productionRef -or
              $env:STAGING_SUPABASE_URL.TrimEnd('/') -eq "https://$productionRef.supabase.co") {
            throw 'Production is a forbidden load-test target.'
          }
          if ($env:TEMPORARY_ACCOUNTS -ne 'true' -and
              [string]::IsNullOrWhiteSpace($env:STAGING_LOAD_CREDENTIALS_JSON)) {
            throw 'The protected synthetic credential pool is missing.'
          }
          if ($env:STAGING_SUPABASE_URL.TrimEnd('/') -ne
              "https://$($env:STAGING_SUPABASE_PROJECT_REF).supabase.co") {
            throw 'The staging URL and project reference do not match.'
          }
          if (-not $env:STAGING_SUPABASE_PUBLISHABLE_KEY.StartsWith('sb_publishable_')) {
            throw 'A staging publishable key is required.'
          }
          'The execution target is isolated staging; no credential value was logged.'

      - name: Supabase CLI for staging parity and health
        if: ${{ steps.profile.outputs.execute == 'true' }}
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Verify staging schema and health before load
        id: preflight
        if: ${{ steps.profile.outputs.execute == 'true' }}
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          supabase link --project-ref $env:STAGING_SUPABASE_PROJECT_REF --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Staging link failed.' }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          ./tool/release_server_preflight.ps1 `
            -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL `
            -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            *> staging/load-preflight-before.txt
          if (-not $?) { throw 'Staging preflight failed.' }

      - name: Flutter stable for the dependency-free Dart runner
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create privacy-safe load plan
        shell: pwsh
        env:
          VIRTUAL_USERS: ${{ steps.profile.outputs.virtual-users }}
        run: |
          dart run tool/staging_load_credential_pipe_contract.dart
          if ($LASTEXITCODE -ne 0) { throw 'Credential pipe contract failed.' }
          dart run tool/staging_load_profile.dart `
            --plan-only `
            --virtual-users=$env:VIRTUAL_USERS `
            --duration-seconds=180 `
            --ramp-up-seconds=60 `
            --output=staging/load-plan.json

      - name: Verify the baseline workflow completed successfully including cleanup
        if: ${{ inputs.stage == 'run-1000' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          if ($env:BASELINE_RUN_ID -notmatch '^\d+$') { throw 'A baseline run ID is required.' }
          $baselineRun = gh api "repos/Rakky88/DragonHaven/actions/runs/$env:BASELINE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $baselineRun.status -ne 'completed' -or
              $baselineRun.conclusion -ne 'success' -or
              $baselineRun.path -ne '.github/workflows/staging-load.yml' -or
              $baselineRun.head_repository.full_name -ne 'Rakky88/DragonHaven') {
            throw 'The complete 100-user baseline workflow must be successful, including cleanup and postflight.'
          }

      - name: Download successful 100-user baseline for the 1000-user gate
        if: ${{ inputs.stage == 'run-1000' }}
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
          name: DragonHaven-staging-load-100
          path: baseline

      - name: Execute realistic authenticated staging load
        if: ${{ steps.profile.outputs.execute == 'true' && !inputs.temporary_accounts }}
        shell: pwsh
        env:
          VIRTUAL_USERS: ${{ steps.profile.outputs.virtual-users }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_LOAD_CREDENTIALS_JSON: ${{ secrets.STAGING_LOAD_CREDENTIALS_JSON }}
        run: |
          $arguments = @(
            'run', 'tool/staging_load_profile.dart',
            '--execute',
            "--virtual-users=$env:VIRTUAL_USERS",
            '--duration-seconds=180',
            '--ramp-up-seconds=60',
            "--confirmation=$env:CONFIRMATION",
            '--synthetic-accounts-confirmed',
            '--output=staging/load-report.json'
          )
          if ($env:VIRTUAL_USERS -eq '1000') {
            $arguments += '--baseline=baseline/load-report.json'
          }
          & dart @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "The staging load runner failed safely with exit code $LASTEXITCODE."
          }

      - name: Execute with temporary confirmed synthetic accounts
        if: ${{ steps.profile.outputs.execute == 'true' && inputs.temporary_accounts }}
        shell: pwsh
        env:
          VIRTUAL_USERS: ${{ steps.profile.outputs.virtual-users }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          $parameters = @{ VirtualUsers = [int]$env:VIRTUAL_USERS; Confirmation = $env:CONFIRMATION }
          if ($env:VIRTUAL_USERS -eq '1000') { $parameters.BaselinePath = 'baseline/load-report.json' }
          ./tool/staging_load_accounts.ps1 @parameters

      - name: Recover synthetic cleanup if the load step was interrupted
        if: ${{ always() && steps.preflight.outcome == 'success' && inputs.temporary_accounts }}
        shell: pwsh
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          if (-not (Test-Path -LiteralPath staging/load-account-lifecycle.json)) { exit 0 }
          $lifecycle = Get-Content -LiteralPath staging/load-account-lifecycle.json -Raw | ConvertFrom-Json
          if ($lifecycle.cleanupComplete) { 'Synthetic cleanup already verified.'; exit 0 }
          ./tool/staging_load_accounts.ps1 -CleanupRunId $lifecycle.runIdentifier
          if (-not $?) { throw 'Synthetic recovery cleanup failed.' }
          $lifecycle = Get-Content -LiteralPath staging/load-account-lifecycle.json -Raw | ConvertFrom-Json
          if (-not $lifecycle.cleanupComplete) { throw 'Recovery did not verify an empty synthetic account set.' }

      - name: Verify staging schema and health after load
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          ./tool/release_server_preflight.ps1 `
            -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL `
            -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            *> staging/load-preflight-after.txt
          if (-not $?) { throw 'Post-load staging preflight failed.' }

      - name: Upload privacy-safe load evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-load-${{ steps.profile.outputs.virtual-users }}
          path: staging/
          if-no-files-found: error
          retention-days: 30
