name: Staging economy inventory snapshot 49

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST_DRAGONHAVEN_STAGING_INVENTORY_SNAPSHOT_49 to run
        required: true
        type: string
      apply:
        description: Apply only after the rollback rehearsal passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dragonhaven-staging-load
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require exact staging-only scope
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          if ($env:CONFIRMATION -cne 'TEST_DRAGONHAVEN_STAGING_INVENTORY_SNAPSHOT_49') {
            throw 'The exact staging inventory-snapshot confirmation is missing.'
          }
          $required = @(
            'STAGING_SUPABASE_URL',
            'STAGING_SUPABASE_PUBLISHABLE_KEY',
            'STAGING_SUPABASE_PROJECT_REF',
            'STAGING_SUPABASE_ACCESS_TOKEN',
            'STAGING_SUPABASE_DB_PASSWORD',
            'STAGING_E2E_EMAIL',
            'STAGING_E2E_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected staging configuration: $name."
            }
          }
          $projectRef = $env:STAGING_SUPABASE_PROJECT_REF.Trim()
          $baseUrl = $env:STAGING_SUPABASE_URL.TrimEnd('/')
          if ($projectRef -eq 'tnzathhutuwmohmjfrlo' -or
              $baseUrl -eq 'https://tnzathhutuwmohmjfrlo.supabase.co') {
            throw 'This workflow must never target production.'
          }
          if ($projectRef -notmatch '^[a-z0-9]{20}$' -or
              $baseUrl -ne "https://$projectRef.supabase.co") {
            throw 'The staging URL and project reference do not match.'
          }

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Verify exact 48 to 49 migration and dry run
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          $expectedRemote = '202609070048'
          $expectedPending = @('202609070049')
          supabase link `
            --project-ref $env:STAGING_SUPABASE_PROJECT_REF `
            --password $env:SUPABASE_DB_PASSWORD
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          $migrationJson = supabase migration list --linked --output-format json
          if ($LASTEXITCODE -ne 0) {
            throw 'The staging migration state could not be read.'
          }
          $migrationResult = ($migrationJson | Out-String) | ConvertFrom-Json
          $remoteVersions = @(
            $migrationResult.migrations |
              ForEach-Object { [string]$_.remote } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object
          )
          if ($remoteVersions.Count -ne 48 -or
              $remoteVersions[-1] -ne $expectedRemote) {
            throw 'Staging is not exactly at expected migration 48.'
          }
          $pendingLocal = @(
            Get-ChildItem supabase/migrations -File -Filter '*.sql' |
              ForEach-Object {
                if ($_.BaseName -notmatch '^(\d+)_') {
                  throw "Migration $($_.Name) has no valid version."
                }
                $Matches[1]
              } |
              Where-Object { [long]$_ -gt [long]$expectedRemote } |
              Sort-Object
          )
          if (@(Compare-Object $expectedPending $pendingLocal).Count -ne 0) {
            throw 'The local pending set is not exactly migration 49.'
          }
          $expectedBaseline = @(Get-ChildItem supabase/migrations -File -Filter '*.sql' |
            ForEach-Object { $_.BaseName.Split('_')[0] } |
            Where-Object { [long]$_ -le [long]$expectedRemote } | Sort-Object)
          if (@(Compare-Object $expectedBaseline $remoteVersions).Count -ne 0) {
            throw 'Staging migration history differs from the complete expected baseline.'
          }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/vanity-health-before.json
          supabase db lint --linked --level error --fail-on error `
            --output-format json |
            Tee-Object -FilePath staging/vanity-lint-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Pre-migration database lint failed.' }
          supabase db push --linked --include-all --dry-run |
            Tee-Object -FilePath staging/vanity-migration-dry-run.txt
          if ($LASTEXITCODE -ne 0) { throw 'Migration 49 dry run failed.' }

      - name: Rehearse exact migration and inventory snapshot with rollback
        shell: pwsh
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          ./tool/staging_inventory_snapshot_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
            -RehearseMigrations |
            Tee-Object -FilePath staging/chest-rehearsal.txt

      - name: Apply only 49 and prove contracts inside rollback
        if: inputs.apply
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked --include-all --yes |
            Tee-Object -FilePath staging/vanity-migration-apply.txt
          if ($LASTEXITCODE -ne 0) { throw 'Migration 49 was not applied.' }
          ./tool/release_server_preflight.ps1 `
            -ExpectedProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ExpectedUrl $env:STAGING_SUPABASE_URL `
            -ExpectedPublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY |
            Tee-Object -FilePath staging/vanity-preflight-after.txt
          ./tool/staging_economy_foundation_e2e.ps1 `
            -SupabaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Email $env:STAGING_E2E_EMAIL `
            -Password $env:STAGING_E2E_PASSWORD `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN `
            -EvidencePath staging/vanity-purchase-e2e.txt `
            -VerifyVanityPurchase
          ./tool/staging_chest_opening_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/chest-contract.txt
          ./tool/staging_item_shop_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/item-shop-contract.txt
          ./tool/staging_inventory_snapshot_contract.ps1 `
            -ProjectRef $env:STAGING_SUPABASE_PROJECT_REF `
            -ManagementAccessToken $env:STAGING_SUPABASE_ACCESS_TOKEN |
            Tee-Object -FilePath staging/inventory-snapshot-contract.txt
          supabase db lint --linked --level error --fail-on error `
            --output-format json |
            Tee-Object -FilePath staging/vanity-lint-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Post-migration database lint failed.' }
          ./tool/public_server_health_check.ps1 `
            -BaseUrl $env:STAGING_SUPABASE_URL `
            -PublishableKey $env:STAGING_SUPABASE_PUBLISHABLE_KEY `
            -Environment staging `
            -OutputPath staging/vanity-health-after.json

      - name: Upload privacy-safe staging evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DragonHaven-staging-inventory-snapshot-49
          path: staging/
          if-no-files-found: warn
          retention-days: 30
