name: Production Halloween preview access 48

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_HALLOWEEN_PREVIEW_48
        required: true
        type: string
      staging_run_id:
        description: Successful staging preview-access workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dragonhaven-production-migrations
  cancel-in-progress: false

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require exact scope
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:CONFIRMATION -cne 'APPLY_PRODUCTION_HALLOWEEN_PREVIEW_48') {
            throw 'The exact production scope is missing.'
          }
      - uses: actions/checkout@v5
      - name: Require successful staging evidence for identical server content
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          if ($env:STAGING_RUN_ID -notmatch '^\d+$') { throw 'A staging run ID is required.' }
          $run = gh api "repos/Rakky88/DragonHaven/actions/runs/$env:STAGING_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or
              $run.path -ne '.github/workflows/staging-seasonal-events.yml' -or
              $run.head_repository.full_name -ne 'Rakky88/DragonHaven') {
            throw 'The exact staging preview-access evidence is missing or failed.'
          }
          git fetch --depth=1 origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { throw 'The tested staging commit could not be resolved.' }
          git diff --exit-code $run.head_sha -- supabase/migrations tool/halloween_preview_contract.sql tool/preview_access_migration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Production server content differs from tested staging.' }
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Rehearse and apply only preview access migration 48
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $keySource = Get-Content -LiteralPath lib/config/online_config.dart -Raw
          $match = [regex]::Match($keySource, 'sb_publishable_[A-Za-z0-9_-]+')
          if (-not $match.Success) { throw 'The public production client key is missing.' }
          ./tool/preview_access_migration.ps1 -Environment production `
            -ProjectRef tnzathhutuwmohmjfrlo -BaseUrl https://tnzathhutuwmohmjfrlo.supabase.co `
            -PublishableKey $match.Value -Confirmation $env:CONFIRMATION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-Halloween-preview-production
          path: production-migration/
          retention-days: 30
