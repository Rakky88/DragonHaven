name: Bounded production schema migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_HALLOWEEN_PREVIEW_48
        required: true
        type: string
      staging_run_id:
        description: Successful staging preview-access workflow run
        required: true
        type: string

      scope:
        description: Exact bounded migration package
        type: choice
        default: preview48
        options: [preview48, release39]

permissions:
  contents: read
  actions: read

concurrency:
  group: dragonhaven-production-migrations
  cancel-in-progress: false

jobs:
  migrate-production:
    if: inputs.scope != 'release39'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require exact scope
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:CONFIRMATION -cne 'APPLY_PRODUCTION_HALLOWEEN_PREVIEW_48') {
            throw 'The exact production scope is missing.'
          }
      - uses: actions/checkout@v5
      - name: Require successful staging evidence for identical server content
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          if ($env:STAGING_RUN_ID -notmatch '^\d+$') { throw 'A staging run ID is required.' }
          $run = gh api "repos/Rakky88/DragonHaven/actions/runs/$env:STAGING_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or
              $run.path -ne '.github/workflows/staging-seasonal-events.yml' -or
              $run.head_repository.full_name -ne 'Rakky88/DragonHaven') {
            throw 'The exact staging preview-access evidence is missing or failed.'
          }
          git fetch --depth=1 origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { throw 'The tested staging commit could not be resolved.' }
          git diff --exit-code $run.head_sha -- supabase/migrations tool/halloween_preview_contract.sql tool/preview_access_migration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Production server content differs from tested staging.' }
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Rehearse and apply only preview access migration 48
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $keySource = Get-Content -LiteralPath lib/config/online_config.dart -Raw
          $match = [regex]::Match($keySource, 'sb_publishable_[A-Za-z0-9_-]+')
          if (-not $match.Success) { throw 'The public production client key is missing.' }
          ./tool/preview_access_migration.ps1 -Environment production `
            -ProjectRef tnzathhutuwmohmjfrlo -BaseUrl https://tnzathhutuwmohmjfrlo.supabase.co `
            -PublishableKey $match.Value -Confirmation $env:CONFIRMATION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: DragonHaven-Halloween-preview-production
          path: production-migration/
          retention-days: 30

  release39-schema:
    if: inputs.scope == 'release39'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Require bounded scope and matching staging evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: production
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          if ($env:RELEASE_ENVIRONMENT -notin @('staging','production') -or
              $env:CONFIRMATION -cne "APPLY_$($env:RELEASE_ENVIRONMENT.ToUpperInvariant())_RELEASE39_SCHEMA_84_86") {
            throw 'The exact release-39 schema scope is missing.'
          }
          if ($env:RELEASE_ENVIRONMENT -ceq 'production') {
            if ($env:STAGING_RUN_ID -notmatch '^\d+$') { throw 'Staging evidence is required.' }
            $run = gh api "repos/Rakky88/DragonHaven/actions/runs/$env:STAGING_RUN_ID" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or
                $run.head_sha -cne $env:GITHUB_SHA -or
                $run.path -cne '.github/workflows/staging-economy-contract-drill.yml' -or
                $run.head_repository.full_name -cne 'Rakky88/DragonHaven') {
              throw 'Staging must pass on exactly this release commit.'
            }
            gh run download $env:STAGING_RUN_ID --name release39-schema-staging --dir staging-evidence
            if ($LASTEXITCODE -ne 0) { throw 'The staging apply evidence is missing.' }
            $evidence = Get-Content staging-evidence/after.json -Raw | ConvertFrom-Json
            if ($evidence.environment -cne 'staging' -or $evidence.migrationCount -ne 86 -or
                -not $evidence.authorityUnchanged -or -not $evidence.syntheticChangesRolledBack) {
              throw 'The staging schema/contract evidence is incomplete.'
            }
          }
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Rehearse, apply only migrations 84-86, and verify
        shell: pwsh
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_PROJECT_REF: tnzathhutuwmohmjfrlo
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          ./tool/release39_schema_apply.ps1 -Confirmation $env:CONFIRMATION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release39-schema-production
          path: release39-schema/
          retention-days: 30
